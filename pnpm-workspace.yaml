# Build scripts are intentionally NOT run on install. These packages ship
# prebuilt binaries or have postinstall scripts we don't need (funding
# notices, optional native rebuilds). Explicit `false` decisions keep
# `pnpm install` / `pnpm build` from stopping on the "ignored builds" prompt.
allowBuilds:
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
